services:
  postgres:
    image: postgres:18
    container_name: aether-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_dev_password
      POSTGRES_DB: aether

    ports:
      - "5432:5432"

    volumes:
      - aether_pg_data:/var/lib/postgresql

volumes:
  aether_pg_data: