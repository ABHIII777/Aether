<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__APP_NAME__</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0b1020;
        color: #e8ecff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, #25306b, transparent 40%),
          #0b1020;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        background: #7c9cff;
        color: #081021;
        font-weight: 700;
        cursor: pointer;
      }

      input {
        width: 100%;
        border: 1px solid #303a66;
        border-radius: 10px;
        padding: 0.75rem;
        background: #111832;
        color: inherit;
      }

      .app {
        width: min(920px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 4rem 0;
      }

      .card {
        border: 1px solid #262f58;
        border-radius: 18px;
        padding: 2rem;
        background: #111832cc;
        backdrop-filter: blur(12px);
      }

      .stack {
        display: grid;
        gap: 1rem;
      }

      .muted {
        color: #9aa6d5;
      }

      .error {
        color: #ff9c9c;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      ul {
        padding-left: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
