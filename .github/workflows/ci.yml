name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: go vet ./...
        working-directory: server

      - run: go test ./...
        working-directory: server

      - run: go build -o /tmp/aether-server .
        working-directory: server

  template:
    runs-on: ubuntu-latest
    needs: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: node packages/cli/dist/index.js create app --root "$RUNNER_TEMP"

      - run: pnpm install --ignore-scripts
        working-directory: ${{ runner.temp }}/app

      - run: pnpm typecheck
        working-directory: ${{ runner.temp }}/app

      - run: pnpm build
        working-directory: ${{ runner.temp }}/app

      - run: test -x bin/app
        working-directory: ${{ runner.temp }}/app
